<link rel="stylesheet" href="/assets/airplane_mode/picnic.min.css">

<h1 class="text-center">Airport Shops</h1>
<div class="flex one two-600 gap-10">
  {% for shop in shops %}
    <div class="card card--raised p-3" style="min-width: 250px;">
      <h3>{{ shop.shop_name }}</h3>
      <p><strong>Airport:</strong> {{ shop.airport }}</p>
      <p>
        <strong>Status:</strong>
        <span class="badge {{ 'color-green' if shop.status == 'Available' else 'color-red' }}">
          {{ shop.status }}
        </span>
      </p>
      <footer>
        <a href="/shop-details?shop={{ shop.name }}" class="button small">View Details</a>
      </footer>
    </div>
  {% endfor %}
</div>
